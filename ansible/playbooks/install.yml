---
- name: Install the pinned DeepSeek V4 Flash production release
  hosts: deepseek_hosts
  become: true
  gather_facts: true
  serial: 1
  roles:
    - preflight
    - platform
    - ryzenadj
    - fan
    - role: rocm_runtime
      when: deepseek_system.engine == 'rocm'
    - artifacts
    - service
    - verify
