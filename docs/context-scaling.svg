<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title description">
  <title id="title">Strix Halo llama.cpp Vulkan IQ3_XXS context scaling</title>
  <desc id="description">Input processing falls from 218.08 to 146.28 tokens per second and generation falls from 30.55 to 17.19 tokens per second as the exact prompt grows from 122,879 to 491,520 tokens. All five measured prompts passed five-key retrieval.</desc>
  <style>
    .background { fill: #ffffff; }
    .frame { fill: none; stroke: #d0d7de; stroke-width: 1; }
    .grid { stroke: #d8dee4; stroke-width: 1; stroke-dasharray: 3 5; }
    .axis { stroke: #57606a; stroke-width: 1.25; }
    .input-line { fill: none; stroke: #0969da; stroke-width: 3; }
    .input-point { fill: #0969da; }
    .generation-line { fill: none; stroke: #bf3989; stroke-width: 3; }
    .generation-point { fill: #bf3989; }
    text { fill: #24292f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .chart-title { font-size: 22px; font-weight: 600; }
    .panel-title { font-size: 16px; font-weight: 600; }
    .tick { font-size: 12px; }
    .value { font-size: 12px; font-weight: 600; }
    .axis-title { font-size: 13px; font-weight: 500; }
    .pass { font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; }
      .frame { stroke: #30363d; }
      .grid { stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .input-line { stroke: #58a6ff; }
      .input-point { fill: #58a6ff; }
      .generation-line { stroke: #db61a2; }
      .generation-point { fill: #db61a2; }
      text { fill: #e6edf3; }
    }
  </style>

