<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title description">
  <title id="title">Matched benchmark comparison</title>
  <desc id="description">Strix Halo llama.cpp Vulkan IQ3_XXS reaches 40.96 tokens per second in 2K-prompt generation, 218.08 in 122,879-token input processing, and 30.55 in 122,879-token generation. Lucebox ROCm ROCmFPX reaches 29.10, 131.19, and 16.40 tokens per second respectively.</desc>
  <style>
    .background { fill: #ffffff; }
    .frame { fill: none; stroke: #d0d7de; stroke-width: 1; }
    .grid { stroke: #d8dee4; stroke-width: 1; stroke-dasharray: 3 5; }
    .axis { stroke: #57606a; stroke-width: 1.25; }
    .vulkan { fill: #0969da; }
    .rocm { fill: #bf3989; }
    text { fill: #24292f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .chart-title { font-size: 22px; font-weight: 600; }
    .legend { font-size: 12px; font-weight: 500; }
    .case { font-size: 14px; font-weight: 600; }
    .tick { font-size: 12px; }
    .value { font-size: 12px; font-weight: 600; }
    .axis-title { font-size: 13px; font-weight: 500; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; }
      .frame { stroke: #30363d; }
      .grid { stroke: #30363d; }
      .axis { stroke: #8b949e; }
      .vulkan { fill: #58a6ff; }
      .rocm { fill: #db61a2; }
      text { fill: #e6edf3; }
    }
  </style>

  <rect class="background" width="900" height="430"/>
  <text class="chart-title" x="450" y="30" text-anchor="middle">Matched benchmark</text>
  <rect class="vulkan" x="92" y="49" width="10" height="10"/>
  <text class="legend" x="111" y="58">Strix Halo llama.cpp Vulkan IQ3_XXS</text>
  <rect class="rocm" x="545" y="49" width="10" height="10"/>
  <text class="legend" x="564" y="58">Lucebox ROCm ROCmFPX</text>

  <rect class="frame" x="300" y="78" width="520" height="280"/>
  <line class="grid" x1="300" y1="78" x2="300" y2="358"/>
  <line class="grid" x1="413" y1="78" x2="413" y2="358"/>
  <line class="grid" x1="526" y1="78" x2="526" y2="358"/>
  <line class="grid" x1="639" y1="78" x2="639" y2="358"/>
  <line class="grid" x1="752" y1="78" x2="752" y2="358"/>

  <text class="case" x="282" y="113" text-anchor="end">2K-prompt generation</text>
  <rect class="vulkan" x="300" y="94" width="93" height="16"/>
  <rect class="rocm" x="300" y="116" width="66" height="16"/>
  <text class="value" x="401" y="107">40.96</text>
  <text class="value" x="374" y="129">29.10</text>

  <text class="case" x="282" y="218" text-anchor="end">122,879-token input</text>
  <rect class="vulkan" x="300" y="199" width="493" height="16"/>
  <rect class="rocm" x="300" y="221" width="297" height="16"/>
  <text class="value" x="801" y="212">218.08</text>
  <text class="value" x="605" y="234">131.19</text>

  <text class="case" x="282" y="323" text-anchor="end">122,879-token generation</text>
  <rect class="vulkan" x="300" y="304" width="69" height="16"/>
  <rect class="rocm" x="300" y="326" width="37" height="16"/>
  <text class="value" x="377" y="317">30.55</text>
  <text class="value" x="345" y="339">16.40</text>

  <line class="axis" x1="300" y1="358" x2="820" y2="358"/>
  <text class="tick" x="300" y="379" text-anchor="middle">0</text>
  <text class="tick" x="413" y="379" text-anchor="middle">50</text>
  <text class="tick" x="526" y="379" text-anchor="middle">100</text>
  <text class="tick" x="639" y="379" text-anchor="middle">150</text>
  <text class="tick" x="752" y="379" text-anchor="middle">200</text>
  <text class="axis-title" x="560" y="408" text-anchor="middle">Tokens per second</text>
</svg>
